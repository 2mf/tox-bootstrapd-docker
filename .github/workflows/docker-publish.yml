name: Build and publish Docker images

on:
  release:
    types: [published]
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    # Only publish production images for version tags.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Load build versions
        shell: bash
        run: |
          grep -Ev '^[[:space:]]*(#|$)' build/image-versions.env >> "$GITHUB_ENV"

          RELEASE_VERSION="${GITHUB_REF_NAME}"
          echo "IMAGE_VERSION=${RELEASE_VERSION#}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Debian images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-debian
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/riscv64
          build-args: |
            TOX_VERSION=${{ env.TOX_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            P2_VERSION=${{ env.P2_VERSION }}
          tags: |
            dm2mf/tox-bootstrapd:debian
            dm2mf/tox-bootstrapd:debian-trixie
            dm2mf/tox-bootstrapd:${{ env.IMAGE_VERSION }}-debian
            dm2mf/tox:debian
            dm2mf/tox:debian-trixie
            dm2mf/tox:${{ env.IMAGE_VERSION }}-debian

      - name: Build and push Alpine images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-alpine
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/riscv64
          build-args: |
            TOX_VERSION=${{ env.TOX_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            P2_VERSION=${{ env.P2_VERSION }}
          tags: |
            dm2mf/tox-bootstrapd:alpine${{ env.ALPINE_VERSION }}
            dm2mf/tox-bootstrapd:alpine
            dm2mf/tox-bootstrapd:${{ env.IMAGE_VERSION }}-alpine
            dm2mf/tox-bootstrapd:latest
            dm2mf/tox:alpine${{ env.ALPINE_VERSION }}
            dm2mf/tox:alpine
            dm2mf/tox:${{ env.IMAGE_VERSION }}-alpine
            dm2mf/tox:latest

  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v6

      - name: Load build versions
        shell: bash
        run: |
          grep -Ev '^[[:space:]]*(#|$)' build/image-versions.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Debian testing image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-debian
          push: true
          platforms: linux/amd64
          build-args: |
            TOX_VERSION=${{ env.TOX_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            P2_VERSION=${{ env.P2_VERSION }}
          tags: dm2mf/tox-bootstrapd:debian-testing

      - name: Build and push Alpine testing image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-alpine
          push: true
          platforms: linux/amd64
          build-args: |
            TOX_VERSION=${{ env.TOX_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            DEBIAN_VERSION=${{ env.DEBIAN_VERSION }}
            GOLANG_VERSION=${{ env.GOLANG_VERSION }}
            P2_VERSION=${{ env.P2_VERSION }}
          tags: dm2mf/tox-bootstrapd:alpine-testing
